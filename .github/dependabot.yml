version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /csharp
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /java
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
