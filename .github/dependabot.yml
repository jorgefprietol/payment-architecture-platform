version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /csharp
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /java
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    # Java 21 is the supported LTS baseline; runtime migrations need a separate review.
    # Keep minor, patch and digest updates enabled for both JDK and JRE images.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
